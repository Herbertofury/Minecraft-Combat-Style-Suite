name: Bootstrap RC18 Source and Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-rc18-source-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-combat-style-suite-rc18
  cancel-in-progress: false

jobs:
  repair-publish:
    name: Rebuild browsable source, verify RC18, publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover canonical RC17 source seed from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          try_seed() {
            local label="$1"; shift
            echo "Trying RC17 seed set: $label"
            rm -rf /tmp/rc17-seed /tmp/rc17-source.tar.xz
            mkdir -p /tmp/rc17-seed
            if ! cat "$@" | base64 --decode > /tmp/rc17-source.tar.xz 2>/dev/null; then return 1; fi
            if ! xz -t /tmp/rc17-source.tar.xz 2>/dev/null; then return 1; fi
            if ! tar -xJf /tmp/rc17-source.tar.xz -C /tmp/rc17-seed 2>/dev/null; then return 1; fi
            local src
            src=$(find /tmp/rc17-seed -type f -path '*/combat-style-suite-5.0.0/build.sh' -printf '%h\n' | head -n1)
            test -n "$src" || return 1
            test -f "$src/README.md" || return 1
            test -f "$src/verify.sh" || return 1
            test -d "$src/director" || return 1
            test -d "$src/compat" || return 1
            test -f "$src/.github/workflows/ci.yml" || return 1
            printf '%s\n' "$src" > /tmp/rc17-src-path
            echo "Recovered RC17 seed with $label"
            return 0
          }

          if try_seed six \
            .bootstrap/rc17-source.b64.00 .bootstrap/rc17-source.b64.01 .bootstrap/rc17-source.b64.02 \
            .bootstrap/rc17-source.b64.03 .bootstrap/rc17-source.b64.04 .bootstrap/rc17-source.b64.05; then
            exit 0
          fi
          if try_seed repaired \
            .bootstrap/rc17-source.b64.00 .bootstrap/rc17-source.b64.01 .bootstrap/rc17-source.b64.02 \
            .bootstrap/rc17-source.b64.03 .bootstrap/rc17-source.b64.04 .bootstrap/rc17-source.b64.05b \
            .bootstrap/rc17-source.b64.06a .bootstrap/rc17-source.b64.06b; then
            exit 0
          fi
          if try_seed extended \
            .bootstrap/rc17-source.b64.00 .bootstrap/rc17-source.b64.01 .bootstrap/rc17-source.b64.02 \
            .bootstrap/rc17-source.b64.03 .bootstrap/rc17-source.b64.04 .bootstrap/rc17-source.b64.05 \
            .bootstrap/rc17-source.b64.05b .bootstrap/rc17-source.b64.06a .bootstrap/rc17-source.b64.06b; then
            exit 0
          fi
          echo 'No staged RC17 seed reconstructed a valid canonical source tree.' >&2
          exit 1

      - name: Replace bootstrap shell with canonical source and apply RC18 fix
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(cat /tmp/rc17-src-path)
          grep -Fq 'RC17 "just works" polish' "$SRC/README.md"
          grep -Fq 'public void m_280488_(Font f,String s,int x,int y,int c)' "$SRC/stubs/net/minecraft/client/gui/GuiGraphics.java"

          rm -rf /tmp/wiki-keep
          if [ -d wiki ]; then cp -a wiki /tmp/wiki-keep; fi
          if [ -f .github/workflows/sync-wiki.yml ]; then cp .github/workflows/sync-wiki.yml /tmp/sync-wiki.yml; fi

          rsync -a --delete --exclude='.git/' --exclude='wiki/' "$SRC/" ./
          if [ -d /tmp/wiki-keep ]; then rm -rf wiki; mv /tmp/wiki-keep wiki; fi
          if [ -f /tmp/sync-wiki.yml ]; then mkdir -p .github/workflows; cp /tmp/sync-wiki.yml .github/workflows/sync-wiki.yml; fi
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-rc16-source.yml .github/workflows/bootstrap-rc17-drive.yml \
            .github/workflows/publish-rc17.yml .github/workflows/publish-rc17-source-asset.yml \
            .github/workflows/bootstrap-rc18-source-and-release.yml

          cat > /tmp/rc18.patch.gz.b64 <<'PATCHB64'

PATCHB64
          base64 --decode /tmp/rc18.patch.gz.b64 | gzip -dc > /tmp/rc18.patch
          git apply -p2 --whitespace=nowarn /tmp/rc18.patch

          chmod +x build.sh verify.sh verify-release.sh scripts/guard-regressions.sh scripts/package-rc17.sh scripts/package-rc18.sh
          test ! -e .bootstrap
          test -d director && test -d compat && test -d stubs && test -d tests
          test -f .github/workflows/ci.yml
          grep -Fq 'public int m_280488_' stubs/net/minecraft/client/gui/GuiGraphics.java
          grep -Fq 'Production GUI Linkage Fix' RELEASE-NOTES.md
          grep -Fq 'GuiProductionLinkageHarness' verify.sh
          git diff --check

      - name: Verify RC18 from canonical source
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/guard-regressions.sh
          ./verify.sh
          ./scripts/package-rc18.sh

          test -f dist/combat-style-director-5.0.0.jar
          test -f dist/punchy-style-compat-5.0.0.jar
          test -f release-rc18/Combat-Style-Suite-5.0.0-RC18-production-gui-linkage-fix.zip
          echo '8fd2b831ea9033ee66d24739bb9e16eb26408043fb3be2e3e7d5f8aeb604bc37  dist/combat-style-director-5.0.0.jar' | sha256sum --check --strict
          echo '5f26495452c934b6016a5bc10bff1d460c3e06c03ef45e8d5b80800ba9109286  dist/punchy-style-compat-5.0.0.jar' | sha256sum --check --strict
          echo 'ac60221bf19ff80c266bc37cc7d6722f28f3e50ac7a5d9a69d01c368a37e8c5e  release-rc18/Combat-Style-Suite-5.0.0-RC18-production-gui-linkage-fix.zip' | sha256sum --check --strict

          cat > release-rc18/PRODUCTION-LINKAGE-VERIFY.txt <<'EOF'
          Combat Style Suite 5.0.0 RC18 - GitHub production linkage verification
          PASS: Suite regression guard
          PASS: packaged Director/Compat GUI bytecode links GuiGraphics.m_280488_(Font,String,int,int,int)I
          PASS: packaged screen render linkage harness
          PASS: full Suite verification
          PASS: deterministic RC18 package hashes match the frozen field-fix candidate

          Frozen hashes:
          8fd2b831ea9033ee66d24739bb9e16eb26408043fb3be2e3e7d5f8aeb604bc37  combat-style-director-5.0.0.jar
          5f26495452c934b6016a5bc10bff1d460c3e06c03ef45e8d5b80800ba9109286  punchy-style-compat-5.0.0.jar
          ac60221bf19ff80c266bc37cc7d6722f28f3e50ac7a5d9a69d01c368a37e8c5e  Combat-Style-Suite-5.0.0-RC18-production-gui-linkage-fix.zip
          EOF

      - name: Commit real browsable RC18 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish Combat Style Suite 5.0.0 RC18 production GUI linkage fix'
          git push origin HEAD:main

      - name: Publish RC18 prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0-rc18
          name: Combat Style Suite 5.0.0 RC18 - Production GUI Linkage Fix
          prerelease: true
          generate_release_notes: false
          body: |
            RC18 is the narrow production-client repair for the real Forge 1.20.1 screen crash reported against RC17.

            The RC17 verifier stub declared `GuiGraphics.m_280488_(Font,String,int,int,int)` as returning `void`, while Minecraft 1.20.1 production SRG returns `int`. Because the JVM return type is part of the descriptor, RC17 could pass source tests yet crash with `NoSuchMethodError` as soon as the Suite Config screen drew text.

            RC18 corrects the production descriptor in both Suite JARs and adds a permanent packaged-bytecode + render-linkage regression gate. Combat routing, RC14 arm ownership, RC17 Better Combat handshake safety, event-only notices, provider toggles, and Punchy pairing behavior are unchanged.

            GitHub CI rebuilds and verifies the frozen RC18 hashes before publication. The remaining explicit field boundary is the full exact five-provider native client matrix; this release specifically proves and repairs the reported GUI symbolic-linkage crash.
          files: |
            dist/combat-style-director-5.0.0.jar
            dist/punchy-style-compat-5.0.0.jar
            release-rc18/Combat-Style-Suite-5.0.0-RC18-production-gui-linkage-fix.zip
            release-rc18/SHA256SUMS.txt
            release-rc18/PRODUCTION-LINKAGE-VERIFY.txt