name: Bootstrap RC16 Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-rc16-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-rc16-source
  cancel-in-progress: false

jobs:
  publish-source:
    name: Verify and publish canonical RC16 source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source-xz.b64.* | base64 --decode > /tmp/combat-style-suite-rc16-source.tar.xz
          echo '4ff185f45f1d7fb087423ad4a1c364fd0824ec23367062e4aa6554e70cb04504  /tmp/combat-style-suite-rc16-source.tar.xz' | sha256sum --check --strict

      - name: Extract canonical source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/combat-style-suite-source
          mkdir -p /tmp/combat-style-suite-source
          tar -xJf /tmp/combat-style-suite-rc16-source.tar.xz -C /tmp/combat-style-suite-source
          test -f /tmp/combat-style-suite-source/combat-style-suite-5.0.0/README.md
          test -f /tmp/combat-style-suite-source/combat-style-suite-5.0.0/build.sh
          test -d /tmp/combat-style-suite-source/combat-style-suite-5.0.0/director
          test -d /tmp/combat-style-suite-source/combat-style-suite-5.0.0/compat
          rsync -a /tmp/combat-style-suite-source/combat-style-suite-5.0.0/ ./
          rm -rf .bootstrap
          chmod +x build.sh verify.sh verify-release.sh

      - name: Commit browsable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Canonical RC16 source is already published.'
            exit 0
          fi
          git commit -m 'Publish Combat Style Suite 5.0.0 RC16 source'
          git push origin HEAD:main
