name: Publish RC17 Source Asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc17-source-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-combat-style-suite-rc17-source
  cancel-in-progress: false

jobs:
  attach-source:
    name: Verify and attach frozen RC17 source ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact frozen source artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1lkUPW4kLr-ONzCFn7L9n-fTuxgTXGCSO' \
            -o Combat-Style-Suite-5.0.0-RC17-just-works-polish-source.zip
          echo '91858d54301c4add8f96814f5fde024df6e007073ec0220ae67982c4fd4d52b2  Combat-Style-Suite-5.0.0-RC17-just-works-polish-source.zip' | sha256sum --check --strict
          unzip -tq Combat-Style-Suite-5.0.0-RC17-just-works-polish-source.zip

      - name: Attach exact source archive to RC17
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0-rc17
          files: Combat-Style-Suite-5.0.0-RC17-just-works-polish-source.zip
